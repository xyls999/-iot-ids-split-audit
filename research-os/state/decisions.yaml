decisions:
  - id: manifest-authority
    decision: "manifest.yaml is the single source of truth"
    status: accepted
  - id: phase-1-scope
    decision: "local disk state + Git + existing Pi capabilities; no orchestrator stack"
    status: accepted
  - id: superpowers-boundary
    decision: "coding/testing/debugging only; never research-methodology authority"
    status: accepted
  - id: zotero-boundary
    decision: "read-only by default; no write tools until separately approved"
    status: accepted
  - id: paperqa-boundary
    decision: "retrieval/evidence aid only; Artifact DAG remains authoritative"
    status: accepted
  - id: ecc
    decision: "ECC is not enabled; defer until explicit approval and conflict review"
    status: accepted
  - id: venue-integrity
    decision: "do not target predatory, deceptive, or guaranteed-acceptance venues"
    status: accepted
  - id: screenshot
    decision: "Screenshot visually verified; venue names transcribed to literature/screenshot-venue-transcription.md"
    status: accepted
  - id: scope-exclusion-robot-dog
    decision: "Exclude quadruped robots, robot dogs, legged sim-to-real and robot-dog navigation from the active project"
    status: accepted
  - id: second-dataset-identity-standard
    decision: "A second IoT IDS validation dataset must have first-party evidence of row-level device/group identity and independent time/capture/provenance blocks; IPs, filenames, attack directories and scenario labels are not substitute device identities."
    status: accepted
